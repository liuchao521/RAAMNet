[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raamnet-hsicd"
version = "0.1.0"
description = "RAAM-Net for binary bitemporal hyperspectral image change detection"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.1"
]

[tool.setuptools.packages.find]
include = ["raamnet*"]
